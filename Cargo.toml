[package]
name = "batcharchive"
version = "0.1.0"
edition = "2024"
description = "BatchArchive - Houdini HIP batch archiver (Rust shell)"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
